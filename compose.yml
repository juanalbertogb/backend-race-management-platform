services:
 dbservice:
   image: mysql:latest
   container_name: maskilometrosdb
   ports:
     - "3306:3306"
   environment:
    MYSQL_ROOT_PASSWORD: root
    MYSQL_DATABASE: maskilometros
   volumes:
     - D:/Documentos/DockerVolumes/maskilometros-data:/var/lib/mysql
#     - mysql-data:/var/lib/mysql
